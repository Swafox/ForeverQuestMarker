name: Release

# Pushing a tag such as v0.1.0 packages the addon with the BigWigs packager and
# uploads it to CurseForge, Wago Addons and GitHub Releases. Interface 16001 in
# the TOC makes the packager label the build for the WoW Forever game version.
# Uploads are skipped for any platform whose token or project ID is not set.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag has a changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version]' section for tag $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
